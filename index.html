<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1a3b">
<title>GTMC Lesson Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0c1f45;--ink-2:#2b3a5c;--mut:#667391;
  --paper:#f6f8fc;--rule:#dfe6f2;--rule-2:#c9d6ec;
  --brass:#b5832a;--brass-d:#9a6f20;--brass-bg:#f7eed7;
  --margin:#c2413b;
  --ok:#1f7a4d;--ok-bg:#def3e7;--warn:#a85d0a;--warn-bg:#fdecd0;--bad:#b42318;--bad-bg:#fde4e1;--info:#1d3f85;--info-bg:#e8eefb;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.muted{color:var(--mut)}
.sm{font-size:13px}
.ic{width:18px;height:18px;flex:none}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#091836,#0c2552);color:#c3d0ea;padding:22px 14px 14px;overflow-y:auto}
.mast{display:flex;gap:12px;align-items:center;padding:0 8px 18px}
.crest{width:40px;height:40px;border-radius:10px;background:var(--brass);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.mast b{display:block;color:#fff;font-size:17px;line-height:1.15}
.mast span{font-size:12px;color:#8fa3cc}
.nav-g{margin:16px 8px 6px;font-size:12px;color:#7f93bd}
.nav-i{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;background:none;color:#c3d0ea;border-radius:9px;cursor:pointer;text-align:left;position:relative}
.nav-i:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-i.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.nav-i.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brass)}
.dot{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--brass);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.me{margin-top:auto;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.1);display:flex;gap:10px;align-items:center}
.me div{min-width:0;flex:1}
.me b{display:block;color:#fff;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me span{font-size:12px;color:#8fa3cc}
.me .ib{color:#9fb2d8}
.me .ib:hover{background:rgba(255,255,255,.1);color:#fff}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex:none}
.av.lg{width:42px;height:42px;font-size:15px}
.col{min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 28px;background:rgba(246,248,252,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.today{font-size:13px;color:var(--mut)}
.tb-r{margin-left:auto;display:flex;gap:10px;align-items:center}
.period{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--rule-2);border-radius:9px;padding:0 6px 0 10px;color:var(--mut)}
.period select{border:0;background:none;padding:8px 4px;min-width:140px;color:var(--ink);font-weight:500;cursor:pointer}
.menu-btn{display:none}
.page{padding:26px 28px 60px;max-width:1120px}
.ph{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.ph h2{font-size:27px;letter-spacing:-.025em;font-weight:700;line-height:1.15}
.ph p{color:var(--mut);margin-top:3px}
.ph-a{display:flex;gap:10px;flex-wrap:wrap}
.foot{padding:0 28px 28px;font-size:13px;color:var(--mut)}
.scrim{display:none}

/* ---------- surfaces ---------- */
.panel{background:#fff;border:1px solid var(--rule);border-radius:12px;margin-bottom:18px;overflow:hidden}
.pad{padding:18px 20px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-bottom:20px}
.fig{background:#fff;padding:15px 18px}
.fig b{display:block;font-size:24px;letter-spacing:-.02em;font-weight:700;line-height:1.2}
.fig span{font-size:13px;color:var(--mut)}
.fig.due b{color:var(--margin)}
.strip.mini{margin:0;border-radius:0;border-width:1px 0}
.strip.mini .fig{padding:11px 16px}
.strip.mini .fig b{font-size:17px}

/* ---------- buttons & forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--ink);color:#fff;transition:background .15s}
.btn:hover{background:#17325f}
.btn.brass{background:var(--brass)}.btn.brass:hover{background:var(--brass-d)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--rule-2)}.btn.ghost:hover{background:#eef3fb}
.btn.danger{background:var(--bad)}.btn.danger:hover{background:#97200f}
.btn.out-danger{background:#fff;color:var(--bad);border-color:#f2c1bb}.btn.out-danger:hover{background:var(--bad-bg)}
.btn.block{width:100%}
.btn.s{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ib{width:34px;height:34px;display:grid;place-items:center;border:1px solid transparent;background:none;border-radius:8px;color:var(--mut);cursor:pointer;flex:none}
.ib:hover{background:#eaf0fa;color:var(--ink)}
.ib.danger:hover{color:var(--bad);background:var(--bad-bg)}
.ib.line{border-color:var(--rule-2);background:#fff}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.fld small{display:block;color:var(--mut);font-size:12px;margin-top:4px}
.in{width:100%;padding:10px 12px;border:1px solid var(--rule-2);border-radius:9px;background:#fff}
.in:focus{outline:2px solid var(--brass);outline-offset:0;border-color:var(--brass)}
textarea.in{min-height:96px;resize:vertical}
.grid2{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.pw{position:relative}.pw .in{padding-right:46px}.pw .ib{position:absolute;right:3px;top:3px}
.search{position:relative;display:block;margin-bottom:18px;max-width:380px}
.search .ic{position:absolute;left:12px;top:12px;color:var(--mut)}
.search .in{padding-left:38px}

/* ---------- badges, notes, empty ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--info-bg);color:var(--info);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.brass{background:var(--brass-bg);color:#7a5614}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.plain{background:#fff;border:1px solid var(--rule-2);color:var(--ink-2)}
.note{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;font-size:14px;margin-bottom:14px;background:var(--info-bg);color:var(--info)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note .btn{margin-left:auto}
.note .ic{margin-top:2px}
.empty{padding:38px 20px;text-align:center;color:var(--mut)}
.empty .ic{width:30px;height:30px;color:#9aa9c6;margin-bottom:8px}
.empty b{display:block;color:var(--ink);margin-bottom:3px}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:600;color:var(--mut);font-size:13px;text-align:left;padding:11px 16px;border-bottom:1px solid var(--rule);white-space:nowrap;background:#fafcff}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#fafcff}
.tbl .num{text-align:right}
.tbl tfoot td{font-weight:700;background:#fafcff;border-top:1px solid var(--rule-2)}
.tbl .due{color:var(--margin);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--ok)}
.who{display:flex;align-items:center;gap:10px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--paper);border:1px solid var(--rule);padding:2px 8px;border-radius:6px}

/* ---------- assignment cards & register ---------- */
.grp{margin-bottom:26px}
.grp-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.grp-h h3{font-size:17px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:16px}
.cards .panel{margin:0}
.asg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 16px 14px 18px}
.asg-h h3{font-size:18px;letter-spacing:-.01em}
.asg-h .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.asg-act{display:flex;gap:2px}
.reg{list-style:none;margin:0;padding:0;position:relative}
.reg::before{content:"";position:absolute;left:64px;top:0;bottom:0;width:1px;background:rgba(194,65,59,.32)}
.reg li{display:grid;grid-template-columns:64px 1fr auto auto;align-items:center;gap:12px;padding:9px 10px 9px 0;border-top:1px solid var(--rule);min-height:54px}
.reg .dt{text-align:center;line-height:1.1}
.reg .dt b{display:block;font-size:19px;font-weight:700}
.reg .dt span{font-size:12px;color:var(--mut)}
.reg .dn{display:flex;flex-direction:column;line-height:1.25;font-weight:500}
.reg .dn small{color:var(--mut);font-weight:400}
.reg .tg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.more{display:block;width:100%;border:0;border-top:1px solid var(--rule);background:#fafcff;color:var(--info);font-weight:600;padding:10px;cursor:pointer}
.more:hover{background:#eef3fb}
.asg-f{padding:14px 18px;border-top:1px solid var(--rule);display:flex;gap:10px;align-items:center}
.none{padding:18px;border-top:1px solid var(--rule);color:var(--mut)}
.cmp-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cmp-h h3{font-size:16px}
.cmp-m{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.reply{border-left:3px solid var(--brass);background:var(--brass-bg);padding:9px 12px;border-radius:0 8px 8px 0;margin-top:10px;white-space:pre-wrap}
.cmp-f{margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
.print-head{display:none}

/* ---------- dialogs ---------- */
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
.scrim2{position:absolute;inset:0;background:rgba(8,20,48,.55)}
.dlg{position:relative;background:#fff;border-radius:16px;width:100%;max-width:460px;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(8,20,48,.35);animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.dlg-h{display:flex;justify-content:space-between;gap:12px;padding:18px 20px 4px}
.dlg-h h3{font-size:18px;letter-spacing:-.01em}
.dlg-b{padding:12px 20px 4px}
.dlg-f{display:flex;justify-content:flex-end;gap:10px;padding:12px 20px 20px}
.info-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

/* ---------- feedback ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,24px);display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;padding:11px 16px;border-radius:11px;opacity:0;pointer-events:none;transition:.22s;z-index:120;max-width:92vw;box-shadow:0 10px 30px rgba(8,20,48,.3)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--bad)}
body.busy::before{content:"";position:fixed;top:0;left:0;height:3px;width:100%;background:linear-gradient(90deg,var(--brass),#efd391,var(--brass));background-size:200% 100%;animation:bar 1s linear infinite;z-index:130}
body.busy button[type=submit],body.busy .btn.primary{opacity:.65;pointer-events:none}
@keyframes bar{to{background-position:-200% 0}}
.skel-wrap{padding:30px;max-width:1000px;margin:0 auto}
.skel{border-radius:10px;background:linear-gradient(90deg,#e8edf6 25%,#f4f7fc 50%,#e8edf6 75%);background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:14px}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.hero{position:relative;color:#fff;padding:44px 56px 44px 128px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  background-color:#091836;
  background-image:repeating-linear-gradient(to bottom,transparent 0 35px,rgba(160,190,240,.13) 35px 36px),linear-gradient(180deg,#091836,#0c2552)}
.hero::before{content:"";position:absolute;top:0;bottom:0;left:96px;width:2px;background:rgba(217,83,79,.6)}
.hero .mast{padding:0}
.hero h1{font-size:clamp(36px,4.6vw,60px);line-height:1.04;letter-spacing:-.035em;font-weight:700;max-width:11ch}
.hero p{margin-top:16px;color:#b7c6e6;max-width:36ch;font-size:16px}
.hero small{color:#8fa3cc}
.lg-wrap{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.lg{width:100%;max-width:380px}
.lg h2{font-size:24px;letter-spacing:-.02em;margin-bottom:4px}
.seg{display:flex;background:#e9eef7;border-radius:10px;padding:4px;margin:18px 0}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:8px;cursor:pointer;color:var(--mut);font-weight:500}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(12,31,69,.12)}

/* ---------- responsive ---------- */
@media(max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:60;transform:translateX(-103%);transition:transform .22s}
  .nav-open .side{transform:none}
  .nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(8,20,48,.5);z-index:55}
  .menu-btn{display:grid}
  .topbar{padding:10px 14px}
  .today{display:none}
  .page{padding:18px 14px 50px}
  .foot{padding:0 14px 24px}
  .login{grid-template-columns:1fr}
  .hero{padding:26px 22px 28px 64px;gap:26px}
  .hero::before{left:40px}
  .hero h1{font-size:34px}
  .hero p{display:none}
  .cards{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:600px){
  #modal{align-items:flex-end;padding:0}
  .dlg{border-radius:16px 16px 0 0;max-width:none}
  .period select{min-width:110px}
}
@media print{
  .side,.topbar,.scrim,.ph-a,.asg-f,.asg-act,.more,.ib,#toast,.foot,.note,#modal{display:none!important}
  .app{display:block}.page{padding:0;max-width:none}
  body{background:#fff}.panel{break-inside:avoid;border-color:#bbb}
  .print-head{display:block;margin-bottom:16px}
  .print-head h2{font-size:20px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Please enable JavaScript to use the lesson register.</p></noscript>

<script>
/* ============ CONFIG ============ */
// Paste your Apps Script Web App URL (ends with /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycby6M7B83PoWGtmbcObBfN9XaTApW172JEmmiIuQP0vvR9uKTtG6t4IBtXHkuOSQjebg/exec';

/* ============ ICONS ============ */
const ICONS = {
  grid:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  wallet:'<path d="M20 12V8H6a2 2 0 0 1 0-4h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  key:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2M16 7l3 3M14 9l2 2"/>',
  message:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
  menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',
  refresh:'<path d="M21 12a9 9 0 0 0-15-6.7L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15 6.7L21 16"/><path d="M16 16h5v5"/>',
  printer:'<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="M17.9 17.9A10.9 10.9 0 0 1 12 19c-6.5 0-10-7-10-7a18 18 0 0 1 5.1-5.9M9.9 4.2A9.7 9.7 0 0 1 12 4c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2M1 1l22 22"/>',
  alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>'
};
const ic = (n, c) => `<svg class="ic${c ? ' ' + c : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ============ HELPERS ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const thisMonth = () => today().slice(0, 7);
const isWeekend = ds => { const g = new Date(ds + 'T00:00:00').getDay(); return g === 0 || g === 6; };
const dparts = ds => { const d = new Date(ds + 'T00:00:00'); if (isNaN(d)) return null; return { d: d.getDate(), m: d.toLocaleDateString('en-GB', {month:'short'}), w: d.toLocaleDateString('en-GB', {weekday:'long'}), y: d.getFullYear() }; };
const fmtDate = ds => { const d = new Date(ds + 'T00:00:00'); return isNaN(d) ? esc(ds) : d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short', year:'numeric'}); };
const fdt = v => { const d = new Date(v); return isNaN(d) ? esc(v || '') : d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}); };
const monthLabel = m => /^\d{4}-\d{2}$/.test(m) ? new Date(m + '-01T00:00:00').toLocaleDateString('en-GB', {month:'long', year:'numeric'}) : m;
const fd = f => Object.fromEntries(new FormData(f).entries());
const money = n => { const c = (S.data && S.data.rates.currency) || '₦'; n = Number(n) || 0; return (n < 0 ? '-' : '') + c + Math.abs(n).toLocaleString(); };
const store = t => { try { t ? localStorage.setItem('gtmc_token', t) : localStorage.removeItem('gtmc_token'); } catch (e) {} };
const loadTok = () => { try { return localStorage.getItem('gtmc_token') || ''; } catch (e) { return ''; } };
const AVC = ['#1d4fa3', '#0f766e', '#6d4bc4', '#a9741f', '#b53a5c', '#475569'];
const initials = n => { const p = String(n || '?').trim().split(/\s+/); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); };
const avatar = (n, cls) => { let h = 0; for (const ch of String(n)) h = (h * 31 + ch.charCodeAt(0)) % 997; return `<span class="av ${cls || ''}" style="background:${AVC[h % AVC.length]}">${esc(initials(n))}</span>`; };

let tt;
function toast(m, bad) {
  const t = $('#toast');
  t.innerHTML = ic(bad ? 'alert' : 'check') + '<span>' + esc(m) + '</span>';
  t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(tt);
  tt = setTimeout(() => { t.className = ''; }, 3800);
}

const S = { token: loadTok(), user: null, data: null, tab: null, month: thisMonth(), auth: 'login', loading: true, nav: false, exp: {}, q: '' };

/* ============ API ============ */
async function api(action, payload) {
  if (!API_URL || API_URL.indexOf('PASTE_') === 0) throw new Error('API_URL is not set. Open index.html and paste your Apps Script /exec URL.');
  const body = JSON.stringify(Object.assign({ action: action, token: S.token }, payload || {}));
  let res;
  try {
    // text/plain avoids the CORS preflight that Apps Script cannot answer
    res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body });
  } catch (e) {
    throw new Error('Cannot reach the server. Check your internet connection.');
  }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('The server sent an unexpected reply. Check the API_URL and that the Web App access is set to Anyone.'); }
  if (!j.ok) {
    if (/session has expired/i.test(j.error || '')) { doLogout(); }
    throw new Error(j.error || 'Request failed.');
  }
  return j;
}

let inflight = false;
async function run(fn) {
  if (inflight) return null;
  inflight = true;
  document.body.classList.add('busy');
  try { return await fn(); }
  catch (e) { toast(e.message || 'Something went wrong.', true); return null; }
  finally { inflight = false; document.body.classList.remove('busy'); }
}

async function mutate(action, payload, msg) {
  const j = await run(() => api(action, payload));
  if (j) { if (j.data) S.data = j.data; closeModal(false); render(); toast(msg || j.message || 'Done'); }
  return j;
}

function doLogout() {
  S.token = ''; S.user = null; S.data = null; S.tab = null; S.auth = 'login'; S.nav = false;
  store('');
  closeModal(false);
  render();
}

/* ============ DIALOGS ============ */
let confirmResolve = null;
function openModal(html) {
  const m = $('#modal');
  m.innerHTML = '<div class="scrim2" data-act="closeModal"></div><div class="dlg" role="dialog" aria-modal="true">' + html + '</div>';
  m.classList.add('on');
  document.body.classList.add('noscroll');
  const f = m.querySelector('input:not([type=hidden]),select,textarea') || m.querySelector('.btn:last-child');
  if (f) setTimeout(() => f.focus(), 30);
}
function closeModal(v) {
  const m = $('#modal');
  const r = confirmResolve; confirmResolve = null;
  m.classList.remove('on'); m.innerHTML = '';
  document.body.classList.remove('noscroll');
  if (r) r(!!v);
}
function ask(o) {
  return new Promise(res => {
    confirmResolve = res;
    openModal(`<div class="dlg-h"><h3>${esc(o.title)}</h3></div><div class="dlg-b"><p class="muted">${esc(o.message)}</p></div>
      <div class="dlg-f"><button class="btn ghost" data-act="dlgNo">Cancel</button><button class="btn ${o.danger ? 'danger' : ''}" data-act="dlgYes">${esc(o.ok || 'Confirm')}</button></div>`);
  });
}
function formModal(title, sub, body, submit, handler, attrs) {
  openModal(`<form data-form="${handler}" ${attrs || ''}>
    <div class="dlg-h"><div><h3>${esc(title)}</h3>${sub ? `<p class="muted sm">${esc(sub)}</p>` : ''}</div><button type="button" class="ib" data-act="closeModal" aria-label="Close">${ic('x')}</button></div>
    <div class="dlg-b">${body}</div>
    <div class="dlg-f"><button type="button" class="btn ghost" data-act="closeModal">Cancel</button><button class="btn brass" id="dlgSubmit">${esc(submit)}</button></div></form>`);
}

/* ============ CALCULATIONS ============ */
const isAdmin = () => S.user && S.user.role === 'admin';
const holMap = () => { const m = {}; S.data.holidays.forEach(h => { m[h.date] = h.note || ''; }); return m; };
const sameAsg = (x, t) => x.teacher === t.teacher && x.subject === t.subject && x.class === t.class;

function calc(t) {
  const all = S.month === 'all';
  const L = t.lessons.filter(l => all || String(l.date).indexOf(S.month) === 0);
  const wd = L.filter(l => l.dayType === 'weekday').length;
  const we = L.length - wd;
  const r = S.data.rates;
  const earned = wd * r.weekday + we * r.weekend;
  const paid = S.data.payments.filter(p => sameAsg(p, t) && (all || p.month === S.month)).reduce((a, p) => a + p.amount, 0);
  return { L: L, wd: wd, we: we, earned: earned, paid: paid, balance: earned - paid };
}
function summary(idxs, admin) {
  const o = { l: 0, wd: 0, we: 0, e: 0, p: 0, vis: false };
  idxs.forEach(i => { const t = S.data.teachers[i], c = calc(t); o.l += c.L.length; o.wd += c.wd; o.we += c.we; if (admin || t.showAmount) { o.vis = true; o.e += c.earned; o.p += c.paid; } });
  return o;
}
function months() {
  const set = new Set([thisMonth()]);
  S.data.teachers.forEach(t => t.lessons.forEach(l => set.add(String(l.date).slice(0, 7))));
  S.data.payments.forEach(p => { if (p.month) set.add(p.month); });
  return Array.from(set).sort().reverse();
}
function sortedIdx() {
  return S.data.teachers.map((t, i) => i).sort((a, b) => {
    const x = S.data.teachers[a], y = S.data.teachers[b];
    return (x.teacher + x.class + x.subject).localeCompare(y.teacher + y.class + y.subject);
  });
}

/* ============ VIEWS ============ */
function card(t, i, admin) {
  const c = calc(t), show = admin || t.showAmount, hol = holMap();
  const sorted = [...c.L].sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const open = !!S.exp[i], list = open ? sorted : sorted.slice(0, 5);
  const figs = [{ v: c.L.length, l: 'Lessons' }, { v: c.wd, l: 'Weekday' }, { v: c.we, l: 'Weekend' }];
  if (show) figs.push({ v: money(c.earned), l: 'Earned' }, { v: money(c.paid), l: 'Paid' }, { v: money(c.balance), l: 'Balance', c: c.balance > 0 ? 'due' : '' });
  const row = l => { const p = dparts(l.date); return `<li>
      <div class="dt"><b>${p ? p.d : '?'}</b><span>${p ? p.m : ''}</span></div>
      <div class="dn">${p ? p.w : esc(l.date)}<small>${p ? p.y : ''}</small></div>
      <div class="tg"><span class="badge ${l.dayType === 'weekend' ? 'brass' : ''}">${l.dayType === 'weekend' ? 'Weekend' : 'Weekday'}</span>${hol[l.date] !== undefined ? '<span class="badge warn">Holiday</span>' : ''}</div>
      ${admin ? `<button class="ib danger" data-act="delLesson" data-row="${l.rowIndex}" aria-label="Delete lesson">${ic('trash')}</button>` : ''}</li>`; };
  return `<article class="panel">
    <div class="asg-h">
      <div><h3>${esc(t.subject)}</h3><div class="tags"><span class="badge plain">${esc(t.class)}</span>${admin ? `<span class="badge ${t.showAmount ? 'ok' : 'warn'}">${t.showAmount ? 'Amounts visible' : 'Amounts hidden'}</span>` : ''}</div></div>
      ${admin ? `<div class="asg-act"><button class="ib" data-act="toggleVis" data-idx="${i}" aria-label="${t.showAmount ? 'Hide amounts from teacher' : 'Show amounts to teacher'}" title="${t.showAmount ? 'Hide amounts from teacher' : 'Show amounts to teacher'}">${ic(t.showAmount ? 'eye' : 'eyeoff')}</button><button class="ib danger" data-act="delTeacher" data-idx="${i}" aria-label="Delete assignment" title="Delete assignment">${ic('trash')}</button></div>` : ''}
    </div>
    ${strip(figs, 'mini')}
    ${sorted.length ? `<ul class="reg">${list.map(row).join('')}</ul>` : '<div class="none">No lessons logged in this period.</div>'}
    ${sorted.length > 5 ? `<button class="more" data-act="expand" data-idx="${i}">${open ? 'Show fewer' : 'Show all ' + sorted.length + ' lessons'}</button>` : ''}
    ${admin ? `<div class="asg-f"><button class="btn brass" data-act="logLesson" data-idx="${i}">${ic('plus')}Log a lesson</button></div>` : ''}
  </article>`;
}

  if (s.vis) figs.push({ v: money(s.e), l: 'Earned' }, { v: money(s.p), l: 'Paid' }, { v: money(s.e - s.p), l: 'Balance', c: s.e - s.p > 0 ? 'due' : '' });

    (d.teachers.length ? strip(figs) : '') +

    `<div class="panel tw">${rows.length ? `<table class="tbl">

        <td class="num">${x.c.wd}</td><td class="num">${x.c.we}</td><td class="num">${money(x.c.earned)}</td><td class="num">${money(x.c.paid)}</td>

      <tfoot><tr><td colspan="3">Total</td><td class="num">${s.wd}</td><td class="num">${s.we}</td><td class="num">${money(s.e)}</td><td class="num">${money(s.p)}</td><td></td><td class="num">${money(out)}</td></tr></tfoot>
    </table>` : empty('users', 'No assignments yet', 'Register a teacher, subject and class to start logging lessons.', `<button class="btn brass" data-act="newAsg">${ic('plus')}New assignment</button>`)}</div>`;
}

function teachersListHtml() {
  const d = S.data, q = S.q.trim().toLowerCase(), groups = {};
  sortedIdx().forEach(i => { const t = d.teachers[i]; if (q && (t.teacher + ' ' + t.subject + ' ' + t.class).toLowerCase().indexOf(q) < 0) return; (groups[t.teacher] = groups[t.teacher] || []).push(i); });
  const names = Object.keys(groups);
  if (!names.length) return `<div class="panel">${empty('search', q ? 'No matches' : 'No assignments yet', q ? 'Try a different name, subject or class.' : 'Register a teacher, subject and class to begin.')}</div>`;
  return names.map(n => `<section class="grp"><div class="grp-h">${avatar(n, 'lg')}<div><h3>${esc(n)}</h3><span class="muted sm">${groups[n].length} assignment${groups[n].length > 1 ? 's' : ''}</span></div></div><div class="cards">${groups[n].map(i => card(d.teachers[i], i, true)).join('')}</div></section>`).join('');
}
function vTeachers() {
  return pageHead(`<button class="btn brass" data-act="newAsg">${ic('plus')}New assignment</button>`) +
    `<label class="search">${ic('search')}<input class="in" data-search placeholder="Search by teacher, subject or class" value="${esc(S.q)}" aria-label="Search"></label>` +
    `<div id="tlist">${teachersListHtml()}</div>`;
}

function vPayments() {
  const d = S.data, admin = isAdmin(), all = S.month === 'all';
  const byDate = (a, b) => String(b.date).localeCompare(String(a.date));
  if (admin) {
    const list = d.payments.filter(p => all || p.month === S.month).sort(byDate);
    const sum = list.reduce((a, p) => a + p.amount, 0);
    return pageHead(`<button class="btn brass" data-act="newPay">${ic('plus')}Record payment</button>`) +
      `<div class="panel tw">${list.length ? `<table class="tbl">
        <thead><tr><th>Paid on</th><th>Teacher</th><th>Subject</th><th>Class</th><th>For month</th><th class="num">Amount</th><th>Note</th><th></th></tr></thead>
        <tbody>${list.map(p => `<tr><td>${fdt(p.date)}</td><td>${esc(p.teacher)}</td><td>${esc(p.subject)}</td><td>${esc(p.class)}</td><td>${esc(monthLabel(p.month))}</td><td class="num">${money(p.amount)}</td><td class="muted">${esc(p.note)}</td><td><button class="ib danger" data-act="delPayment" data-row="${p.rowIndex}" aria-label="Delete payment">${ic('trash')}</button></td></tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="5">Total paid</td><td class="num">${money(sum)}</td><td colspan="2"></td></tr></tfoot></table>`
        : empty('wallet', 'No payments in this period', 'Payments you record will appear here.', `<button class="btn brass" data-act="newPay">${ic('plus')}Record payment</button>`)}</div>`;
  }
  const anyShow = d.teachers.some(t => t.showAmount);
  const visible = d.payments.filter(p => d.teachers.some(t => t.showAmount && sameAsg(p, t)) && (all || p.month === S.month)).sort(byDate);
  const sum = visible.reduce((a, p) => a + p.amount, 0);
  if (!anyShow) return pageHead() + `<div class="panel">${empty('eyeoff', 'Amounts are not shown', 'The administrator has not made amounts visible for your account.')}</div>`;
  return pageHead() + strip([{ v: money(sum), l: 'Received in this period' }, { v: visible.length, l: 'Payments' }]) +
    `<div class="panel tw">${visible.length ? `<table class="tbl">
      <thead><tr><th>Paid on</th><th>Subject</th><th>Class</th><th>For month</th><th class="num">Amount</th><th>Note</th></tr></thead>
      <tbody>${visible.map(p => `<tr><td>${fdt(p.date)}</td><td>${esc(p.subject)}</td><td>${esc(p.class)}</td><td>${esc(monthLabel(p.month))}</td><td class="num">${money(p.amount)}</td><td class="muted">${esc(p.note)}</td></tr>`).join('')}</tbody></table>`
      : empty('wallet', 'No payments in this period', 'When the school pays you, it will show here.')}</div>`;
}

function vHolidays() {
  const list = [...S.data.holidays].sort((a, b) => String(b.date).localeCompare(String(a.date)));
  return pageHead(`<button class="btn brass" data-act="newHol">${ic('plus')}Add holiday</button>`) +
    `<div class="panel tw">${list.length ? `<table class="tbl"><thead><tr><th>Date</th><th>Note</th><th></th></tr></thead>
      <tbody>${list.map(h => `<tr><td>${fmtDate(h.date)}</td><td class="muted">${esc(h.note)}</td><td class="num"><button class="ib danger" data-act="delHoliday" data-row="${h.rowIndex}" aria-label="Delete holiday">${ic('trash')}</button></td></tr>`).join('')}</tbody></table>`
      : empty('calendar', 'No holidays set', 'Add the dates when school is closed.', `<button class="btn brass" data-act="newHol">${ic('plus')}Add holiday</button>`)}</div>`;
}

function vRates() {
  const r = S.data.rates;
  return pageHead() + `<form class="panel pad" data-form="rates" style="max-width:620px">
    <div class="grid2">
      <label class="fld"><span>Weekday rate per lesson</span><input class="in" name="rateWeekday" type="number" min="0" step="any" value="${r.weekday}" required></label>
      <label class="fld"><span>Weekend rate per lesson</span><input class="in" name="rateWeekend" type="number" min="0" step="any" value="${r.weekend}" required></label>
      <label class="fld"><span>Most lessons per class per day</span><select class="in" name="maxLessonsPerDay"><option value="1" ${r.maxLessonsPerDay === 1 ? 'selected' : ''}>1</option><option value="2" ${r.maxLessonsPerDay === 2 ? 'selected' : ''}>2</option></select></label>
      <label class="fld"><span>Currency symbol</span><input class="in" name="currency" value="${esc(r.currency)}" maxlength="4" required></label>
    </div>
    <button class="btn brass">Save rates</button></form>`;
}

function vAccounts() {
  const list = [...S.data.accounts].sort((a, b) => (a.status === 'pending' ? 0 : 1) - (b.status === 'pending' ? 0 : 1) || a.username.localeCompare(b.username));
  const cls = s => s === 'active' ? 'ok' : s === 'pending' ? 'warn' : 'bad';
  return pageHead(`<button class="btn brass" data-act="newAcc">${ic('plus')}Create account</button>`) +
    `<div class="panel tw"><table class="tbl">
      <thead><tr><th>Account</th><th>Teacher name</th><th>Role</th><th>Status</th><th>Password</th><th></th></tr></thead>
      <tbody>${list.map(a => `<tr>
        <td><div class="who">${avatar(a.teacherName || a.username)}@${esc(a.username)}</div></td>
        <td>${esc(a.teacherName) || '<span class="muted">None</span>'}</td>
        <td>${a.role === 'admin' ? 'Administrator' : 'Teacher'}</td>
        <td><span class="badge ${cls(a.status)}">${esc(a.status.charAt(0).toUpperCase() + a.status.slice(1))}</span></td>
        <td><span class="code">${esc(a.plainPassword)}</span> <button class="ib" data-act="copy" data-v="${esc(a.plainPassword)}" aria-label="Copy password" title="Copy password">${ic('copy')}</button></td>
        <td class="num">${a.role === 'admin' ? '' : (a.status === 'active'
          ? `<button class="btn out-danger s" data-act="deactivate" data-uid="${esc(a.id)}">Deactivate</button>`
          : `<button class="btn s" data-act="approve" data-uid="${esc(a.id)}">${a.status === 'pending' ? 'Approve' : 'Activate'}</button>`)}</td>
      </tr>`).join('')}</tbody></table></div>`;
}

function vComplaints() {
  const admin = isAdmin(), list = [...S.data.complaints].reverse();
  const cls = s => s === 'Resolved' ? 'ok' : s === 'Under Review' ? 'brass' : 'warn';
  const item = c => `<article class="panel pad">
      <div class="cmp-h"><h3>${esc(c.title)}</h3><span class="badge ${cls(c.status)}">${esc(c.status)}</span></div>
      <div class="cmp-m"><span class="badge plain">${esc(c.category)}</span>${admin ? `<span class="badge plain">@${esc(c.submittedBy)}</span>` : ''}<span class="muted sm">${fdt(c.createdAt)}</span></div>
      <p style="white-space:pre-wrap">${esc(c.description)}</p>
      ${!admin && c.adminResponse ? `<div class="reply"><b>Reply from the administrator</b><br>${esc(c.adminResponse)}</div>` : ''}
      ${admin ? `<form class="cmp-f" data-form="updComplaint" data-cid="${esc(c.id)}">
        <div class="grid2"><label class="fld"><span>Status</span><select class="in" name="status">${['Pending', 'Under Review', 'Resolved'].map(s => `<option ${c.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label></div>
        <label class="fld"><span>Your reply</span><textarea class="in" name="adminResponse">${esc(c.adminResponse)}</textarea></label>
        <button class="btn s">Save response</button></form>` : ''}
    </article>`;
  return pageHead(admin ? '' : `<button class="btn brass" data-act="newCmp">${ic('plus')}New complaint</button>`) +
    (list.length ? list.map(item).join('') : `<div class="panel">${empty('message', 'No complaints', admin ? 'Nothing needs your attention.' : 'If something is wrong with your lessons or payments, tell the administrator here.')}</div>`);
}

function vAccount() {
  return pageHead() + `<form class="panel pad" data-form="changePw" autocomplete="off" style="max-width:440px">
    <label class="fld"><span>Current password</span><input class="in" name="oldPassword" type="password" required></label>
    <label class="fld"><span>New password</span><input class="in" name="newPassword" type="password" required minlength="8"><small>At least 8 characters.</small></label>
    <label class="fld"><span>Confirm new password</span><input class="in" name="confirm" type="password" required minlength="8"></label>
    <button class="btn brass">Update password</button></form>`;
}

/* ============ MODAL FORMS ============ */
let lessonIdx = -1;
function lessonInfoHtml(t, date, admin) {
  if (!date) return '';
  const r = S.data.rates, wk = isWeekend(date), n = t.lessons.filter(l => l.date === date).length, hol = holMap();
  const show = admin || t.showAmount;
  let h = `<div class="info-row"><span class="badge ${wk ? 'brass' : ''}">${wk ? 'Weekend' : 'Weekday'}</span>${show ? `<span class="badge ok">${money(wk ? r.weekend : r.weekday)} per lesson</span>` : ''}<span class="badge plain">${n} of ${r.maxLessonsPerDay} logged that day</span></div>`;
  if (n >= r.maxLessonsPerDay) h += `<div class="note bad">${ic('alert')}<span>This class already has the most lessons allowed on that date.</span></div>`;
  if (hol[date] !== undefined) h += `<div class="note warn">${ic('alert')}<span>That date is a holiday${hol[date] ? ' (' + esc(hol[date]) + ')' : ''}. You can still log it.</span></div>`;
  return h;
}
function updLessonInfo() {
  const el = $('#lessonInfo'), inp = $('#lessonDate');
  if (!el || !inp || lessonIdx < 0) return;
  const t = S.data.teachers[lessonIdx];
  el.innerHTML = lessonInfoHtml(t, inp.value, isAdmin());
  const btn = $('#dlgSubmit');
  if (btn) btn.disabled = !inp.value || t.lessons.filter(l => l.date === inp.value).length >= S.data.rates.maxLessonsPerDay;
}
function openLessonModal(i) {
  if (!isAdmin()) return toast('Only an administrator can log lessons.', true);
  lessonIdx = i;
  const t = S.data.teachers[i], admin = isAdmin();
  formModal('Log a lesson', t.subject + ', ' + t.class + (admin ? ' (' + t.teacher + ')' : ''),
    `<label class="fld"><span>Lesson date</span><input id="lessonDate" class="in" type="date" name="date" value="${today()}" required></label><div id="lessonInfo"></div>`,
    'Log lesson', 'lessonModal', `data-idx="${i}"`);
  updLessonInfo();
}

/* ============ FORM HANDLERS ============ */
const FORMS = {
  async login(f) {
    const v = fd(f), b = f.querySelector('.btn'), lab = b.textContent;
    b.textContent = 'Signing in…';
    const j = await run(() => api('login', { username: v.username, password: v.password }));
    b.textContent = lab;
    if (!j) return;
    S.token = j.token; store(j.token);
    S.user = j.user; S.data = j.data;
    S.tab = isAdmin() ? 'overview' : 'lessons';
    render();
  },
  async register(f) {
    const j = await run(() => api('selfRegister', fd(f)));
    if (j) { S.auth = 'login'; render(); toast(j.message || 'Registration submitted.'); }
  },
  async lessonModal(f) {
    if (!isAdmin()) return toast('Only an administrator can log lessons.', true);
    const t = S.data.teachers[Number(f.dataset.idx)], date = fd(f).date;
    if (!date) return toast('Pick a date.', true);
    const j = await mutate('addLesson', { teacher: t.teacher, subject: t.subject, class: t.class, date: date, dayType: isWeekend(date) ? 'weekend' : 'weekday' }, 'Lesson logged.');
    if (j) { S.month = date.slice(0, 7); render(); }
  },
  addTeacher(f) { return mutate('registerTeacher', fd(f), 'Assignment registered.'); },
  holiday(f) { return mutate('addHoliday', fd(f), 'Holiday added.'); },
  rates(f) {
    const v = fd(f);
    return mutate('updateRates', { rateWeekday: v.rateWeekday, rateWeekend: v.rateWeekend, maxLessonsPerDay: v.maxLessonsPerDay, currency: v.currency }, 'Rates saved.');
  },
  payment(f) {
    const v = fd(f), t = S.data.teachers[Number(v.idx)];
    return mutate('addPayment', { teacher: t.teacher, subject: t.subject, class: t.class, amount: v.amount, date: v.date, month: v.month, note: v.note }, 'Payment recorded.');
  },
  createAccount(f) { return mutate('createTeacherAccount', fd(f), 'Account created.'); },
  complaint(f) { return mutate('submitComplaint', fd(f), 'Complaint submitted.'); },
  updComplaint(f) {
    const v = fd(f);
    return mutate('updateComplaint', { complaintId: f.dataset.cid, status: v.status, adminResponse: v.adminResponse }, 'Response saved.');
  },
  async changePw(f) {
    const v = fd(f);
    if (v.newPassword !== v.confirm) return toast('The new passwords do not match.', true);
    const j = await run(() => api('changePassword', { oldPassword: v.oldPassword, newPassword: v.newPassword }));
    if (j) { f.reset(); toast(j.message || 'Password updated.'); }
  }
};

/* ============ CLICK ACTIONS ============ */
const ACTS = {
  auth(el) { S.auth = el.dataset.mode; render(); },
  tab(el) { S.tab = el.dataset.tab; S.nav = false; render(); window.scrollTo(0, 0); },
  menu() { S.nav = !S.nav; const a = $('.app'); if (a) a.classList.toggle('nav-open', S.nav); },
  async refresh() {
    const j = await run(() => api('getDashboard'));
    if (j) { S.user = j.user; S.data = j.data; render(); toast('Up to date.'); }
  },
  async logout() { try { await api('logout'); } catch (e) {} doLogout(); },
  print() { window.print(); },
  togglePw(el) {
    const i = el.parentElement.querySelector('input'), show = i.type === 'password';
    i.type = show ? 'text' : 'password';
    el.innerHTML = ic(show ? 'eyeoff' : 'eye');
    el.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  },
  async copy(el) { try { await navigator.clipboard.writeText(el.dataset.v); toast('Password copied.'); } catch (e) { toast('Could not copy. Select the text instead.', true); } },
  expand(el) { const i = el.dataset.idx; S.exp[i] = !S.exp[i]; render(); },
  closeModal() { closeModal(false); },
  dlgYes() { closeModal(true); },
  dlgNo() { closeModal(false); },
  logLesson(el) {
    if (!isAdmin()) return toast('Only an administrator can log lessons.', true);
    openLessonModal(Number(el.dataset.idx));
  },
  newAsg() {
    const names = Array.from(new Set(S.data.teachers.map(t => t.teacher)));
    formModal('New assignment', 'Link a teacher to a subject and class.',
      `<label class="fld"><span>Teacher name</span><input class="in" name="teacher" list="tnames" required><small>Use the same spelling as the teacher's account.</small></label>
       <datalist id="tnames">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
       <label class="fld"><span>Subject</span><input class="in" name="subject" required></label>
       <label class="fld"><span>Class</span><input class="in" name="class" required></label>`, 'Register', 'addTeacher');
  },
  newPay() {
    if (!S.data.teachers.length) return toast('Register an assignment before recording a payment.', true);
    formModal('Record a payment', 'Money paid to a teacher for one assignment.',
      `<label class="fld"><span>Assignment</span><select class="in" name="idx" required>${sortedIdx().map(i => { const t = S.data.teachers[i]; return `<option value="${i}">${esc(t.teacher)}: ${esc(t.subject)}, ${esc(t.class)}</option>`; }).join('')}</select></label>
       <div class="grid2"><label class="fld"><span>Amount</span><input class="in" name="amount" type="number" min="1" step="any" required></label>
       <label class="fld"><span>Date paid</span><input class="in" name="date" type="date" value="${today()}" required></label></div>
       <label class="fld"><span>Payment is for</span><input class="in" name="month" type="month" value="${thisMonth()}" required></label>
       <label class="fld"><span>Note (optional)</span><input class="in" name="note"></label>`, 'Save payment', 'payment');
  },
  newHol() {
    formModal('Add a holiday', 'Teachers are warned when they log a lesson on this date.',
      `<label class="fld"><span>Date</span><input class="in" name="date" type="date" required></label>
       <label class="fld"><span>Name (optional)</span><input class="in" name="note" placeholder="For example, Independence Day"></label>`, 'Add holiday', 'holiday');
  },
  newAcc() {
    formModal('Create a teacher account', 'The account is active straight away.',
      `<label class="fld"><span>Teacher name</span><input class="in" name="teacherName" required><small>Must match the name on the teacher's assignments.</small></label>
       <label class="fld"><span>Username</span><input class="in" name="username" required autocapitalize="none" pattern="[A-Za-z0-9._\\-]{4,30}"></label>
       <label class="fld"><span>Password</span><input class="in" name="password" type="text" required minlength="8"><small>At least 8 characters.</small></label>`, 'Create account', 'createAccount');
  },
  newCmp() {
    formModal('New complaint', 'The administrator will reply here.',
      `<label class="fld"><span>Category</span><select class="in" name="category"><option>Payment</option><option>Lesson record</option><option>Account</option><option>Other</option></select></label>
       <label class="fld"><span>Title</span><input class="in" name="title" maxlength="120" required></label>
       <label class="fld"><span>Details</span><textarea class="in" name="description" maxlength="5000" required></textarea></label>`, 'Submit complaint', 'complaint');
  },
  async delLesson(el) { if (!isAdmin()) return; if (await ask({ title: 'Delete this lesson?', message: 'It will be removed from the record and from the earnings total.', ok: 'Delete lesson', danger: true })) mutate('deleteLesson', { rowIndex: Number(el.dataset.row) }, 'Lesson deleted.'); },
  toggleVis(el) {
    const t = S.data.teachers[Number(el.dataset.idx)];
    mutate('toggleVisibility', { teacher: t.teacher, subject: t.subject, class: t.class, show: !t.showAmount }, t.showAmount ? 'Amounts hidden from the teacher.' : 'Amounts now visible to the teacher.');
  },
  async delTeacher(el) {
    const t = S.data.teachers[Number(el.dataset.idx)];
    if (await ask({ title: 'Delete this assignment?', message: t.teacher + ', ' + t.subject + ' (' + t.class + ') and every lesson logged under it will be removed. This cannot be undone.', ok: 'Delete assignment', danger: true }))
      mutate('deleteTeacher', { teacher: t.teacher, subject: t.subject, class: t.class }, 'Assignment deleted.');
  },
  async delHoliday(el) { if (await ask({ title: 'Delete this holiday?', message: 'Teachers will no longer be warned about this date.', ok: 'Delete holiday', danger: true })) mutate('deleteHoliday', { rowIndex: Number(el.dataset.row) }, 'Holiday deleted.'); },
  async delPayment(el) { if (await ask({ title: 'Delete this payment?', message: 'The teacher\'s balance will go up by this amount.', ok: 'Delete payment', danger: true })) mutate('deletePayment', { rowIndex: Number(el.dataset.row) }, 'Payment deleted.'); },
  approve(el) { mutate('approveAccount', { userId: el.dataset.uid }, 'Account activated.'); },
  async deactivate(el) { if (await ask({ title: 'Deactivate this account?', message: 'The person will not be able to sign in until you activate the account again.', ok: 'Deactivate', danger: true })) mutate('deactivateAccount', { userId: el.dataset.uid }, 'Account deactivated.'); }
};

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const h = FORMS[f.dataset.form];
  if (h) h(f);
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const h = ACTS[el.dataset.act];
  if (h) { e.preventDefault(); h(el); }
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.sel === 'month') { S.month = e.target.value; render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'lessonDate') updLessonInfo();
  if (t.dataset && t.dataset.search !== undefined) { S.q = t.value; const l = $('#tlist'); if (l) l.innerHTML = teachersListHtml(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#modal').classList.contains('on')) closeModal(false);
  else if (S.nav) ACTS.menu();
});

/* ============ BOOT ============ */
(async function boot() {
  render();
  if (S.token) {
    try {
      const j = await api('getDashboard');
      S.user = j.user; S.data = j.data;
      S.tab = isAdmin() ? 'overview' : 'lessons';
    } catch (e) { S.token = ''; store(''); }
  }
  S.loading = false;
  render();
})();
</script>
</body>
</html>
